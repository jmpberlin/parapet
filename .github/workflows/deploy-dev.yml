name: Deploy dev preview (PRs)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dev-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Write CI deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/ci_runner_key
          echo "${{ secrets.CI_RUNNER_SSH_KEY }}" > ~/.ssh/ci_runner_key

      - name: Prove connectivity to dev box via subnet route
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_runner_key \
            ci_runner@10.0.0.4 'hostname && groups'
name: Deploy dev preview (PRs)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dev-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
    environment:
      name: dev
      url: http://${{ vars.DEV_SERVER_PRIVATE_IP }}:8090
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        run: |
          for svc in backend frontend; do
            img=ghcr.io/jmpberlin/parapet-$svc
            docker build -t $img:${IMAGE_TAG} ./$svc
            docker push $img:${IMAGE_TAG}
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write CI deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/ci_runner_key
          echo "${{ secrets.CI_RUNNER_SSH_KEY }}" > ~/.ssh/ci_runner_key

      - name: Write .env
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_runner_key \
            ci_runner@${{ vars.DEV_SERVER_PRIVATE_IP }} "cat > /opt/parapet-dev/.env" <<EOF
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          BACKEND_PORT=${{ vars.BACKEND_PORT }}
          BACKEND_HOST_PORT=${{ vars.BACKEND_HOST_PORT }}
          BACKEND_HOST=${{ vars.BACKEND_HOST }}
          FRONTEND_HOST_PORT=${{ vars.FRONTEND_HOST_PORT }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN=${{ secrets.PAT_GITHUB }}
          VITE_API_URL=${{ vars.VITE_API_URL }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          GATEWAY_PROXY_PRIVATE_IP=${{ vars.GATEWAY_PROXY_PRIVATE_IP }}
          GATEWAY_PROXY_PORT=${{ vars.GATEWAY_PROXY_PORT }}
          DEV_SERVER_PRIVATE_IP=${{ vars.DEV_SERVER_PRIVATE_IP }}
          EOF
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_runner_key \
            ci_runner@${{ vars.DEV_SERVER_PRIVATE_IP }} "bash -euo pipefail -s" <<EOF
            cd /opt/parapet-dev
            git fetch origin ${IMAGE_TAG}
            git checkout --detach FETCH_HEAD
            export IMAGE_TAG=${IMAGE_TAG}
            docker compose pull backend frontend
            docker compose up -d
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/ci_runner_key ci_runner@${{ vars.DEV_SERVER_PRIVATE_IP }} \
            'curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:8090/api/health'
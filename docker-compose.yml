services:
  postgres:
    image: postgres:15-alpine
    container_name: parapet-postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
  backend:
    build:
      context: ./backend
    image: ghcr.io/jmpberlin/parapet-backend:${IMAGE_TAG:-latest}
    container_name: parapet-backend
    environment:
      - PORT=${BACKEND_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - HTTP_PROXY=${GATEWAY_HTTP_PROXY:-}
      - HTTPS_PROXY=${GATEWAY_HTTPS_PROXY:-}
      - NO_PROXY=postgres,localhost,127.0.0.1
    ports:
      - '${BACKEND_HOST}:${BACKEND_HOST_PORT}:${BACKEND_PORT}'
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/jmpberlin/parapet-frontend:${IMAGE_TAG:-latest}
    container_name: parapet-frontend
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-8090}:80'
      - '${DEV_SERVER_PRIVATE_IP}:${FRONTEND_HOST_PORT:-8090}:80'
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
  loki:
    container_name: parapet-loki
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - observability-network

  promtail:
    container_name: parapet-promtail
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - promtail-positions:/var/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - observability-network

  grafana:
    container_name: parapet-grafana
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "${DEV_SERVER_PRIVATE_IP}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - loki
    networks:
      - observability-network

  adminer:
    container_name: parapet-adminer
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "${DEV_SERVER_PRIVATE_IP}:8081:8080"
      - "127.0.0.1:8081:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  observability-network:
    driver: bridge

volumes:
  postgres-data:
  loki-data:
  grafana-data:
  promtail-positions:
